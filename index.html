<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>switch-terminal</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <aside id="sidebar"></aside>
    <div id="sidebar-handle" role="separator" aria-orientation="vertical" aria-controls="sidebar" aria-label="Redimensionar barra lateral" tabindex="0" title="Arraste para redimensionar · duplo clique restaura"></div>
    <main>
      <header>
        <button id="toggle-sidebar" title="Recolher barra lateral" aria-label="Recolher barra lateral" aria-controls="sidebar" aria-expanded="true">☰</button>
        <nav id="tabs"></nav>
        <span id="title"></span>
      </header>
      <div id="panes">
        <div id="empty"></div>
        <div id="wait" role="status" aria-live="polite" hidden></div>
      </div>
    </main>
    <dialog id="add-dialog" class="form">
      <form method="dialog">
        <h2>Nova worktree</h2>
        <label>
          Projeto
          <select name="project"></select>
        </label>
        <label>
          Branch
          <input name="branch" required placeholder="feat/minha-feature" spellcheck="false" autocomplete="off" />
          <small>Se a branch já existir, ela é usada e "a partir de" é ignorado.</small>
        </label>
        <fieldset class="side" data-side="api">
          <legend><label><input type="checkbox" name="api" checked /> API</label></legend>
          <label>
            Diretório
            <span class="dir-row">
              <input name="api-dir" required spellcheck="false" autocomplete="off" />
              <button type="button" class="pick">Escolher…</button>
            </span>
          </label>
          <small class="preview"></small>
          <label>
            A partir de
            <select name="api-base"></select>
          </label>
          <p class="side-error"></p>
        </fieldset>
        <fieldset class="side" data-side="front">
          <legend><label><input type="checkbox" name="front" checked /> Front</label></legend>
          <label>
            Diretório
            <span class="dir-row">
              <input name="front-dir" required spellcheck="false" autocomplete="off" />
              <button type="button" class="pick">Escolher…</button>
            </span>
          </label>
          <small class="preview"></small>
          <label>
            A partir de
            <select name="front-base"></select>
          </label>
          <p class="side-error"></p>
        </fieldset>
        <p class="error" role="alert"></p>
        <menu>
          <button value="cancel" formnovalidate>Cancelar</button>
          <button value="ok" class="primary">Criar</button>
        </menu>
      </form>
    </dialog>
    <dialog id="project-dialog" class="form">
      <form method="dialog">
        <h2>Novo projeto</h2>
        <label>
          Nome
          <input name="name" required placeholder="meu-projeto" spellcheck="false" autocomplete="off" />
        </label>
        <fieldset data-side="api">
          <legend>API</legend>
          <label>
            Repositório
            <span class="dir-row">
              <input name="api-repo" required spellcheck="false" autocomplete="off" />
              <button type="button" class="pick">Escolher…</button>
            </span>
            <small>No layout bare, é a pasta que contém o <code>.bare</code>.</small>
          </label>
          <label>
            Comando de start
            <input name="api-start" value="npm run dev" spellcheck="false" autocomplete="off" />
          </label>
          <label>
            Comando de setup (opcional)
            <input name="api-setup" placeholder="npm install" spellcheck="false" autocomplete="off" />
            <small>Roda antes do start só na primeira vez de uma worktree criada pelo app.</small>
          </label>
        </fieldset>
        <fieldset data-side="front">
          <legend>Front</legend>
          <label>
            Repositório
            <span class="dir-row">
              <input name="front-repo" required spellcheck="false" autocomplete="off" />
              <button type="button" class="pick">Escolher…</button>
            </span>
            <small>No layout bare, é a pasta que contém o <code>.bare</code>.</small>
          </label>
          <label>
            Comando de start
            <input name="front-start" value="npm run dev" spellcheck="false" autocomplete="off" />
          </label>
          <label>
            Comando de setup (opcional)
            <input name="front-setup" placeholder="npm install" spellcheck="false" autocomplete="off" />
            <small>Roda antes do start só na primeira vez de uma worktree criada pelo app.</small>
          </label>
        </fieldset>
        <p class="error" role="alert"></p>
        <menu>
          <button value="cancel" formnovalidate>Cancelar</button>
          <button value="ok" class="primary">Criar projeto</button>
        </menu>
      </form>
    </dialog>
    <div id="palette" hidden>
      <input placeholder="Trocar de worktree…" spellcheck="false" />
      <ul></ul>
    </div>
  </body>
</html>
