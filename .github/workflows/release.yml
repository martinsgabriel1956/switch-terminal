name: Release

# Toda versão nova que chega na main vira um release com o .deb, o .rpm e o PKGBUILD do AUR. A versão mora no tauri.conf.json (o "chore: versão X"
# muda ele junto com package.json e Cargo.toml); se a tag v<versão> já existe, o release já foi feito e nada roda.
on:
  push:
    branches: [main]
    paths: [src-tauri/tauri.conf.json]
  workflow_dispatch:

permissions:
  contents: write

# Dois pushes seguidos não criam o mesmo release duas vezes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version já tem release; nada a fazer."
          fi

  release:
    needs: check
    if: needs.check.outputs.exists != 'true'
    # 22.04: o .deb linka contra a glibc mais antiga e instala também nas distros mais novas.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # O que o Tauri v2 pede no Linux; o appindicator é da bandeja (tray-icon).
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # Testes, .deb, notas e o release: o mesmo script que roda à mão.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh
